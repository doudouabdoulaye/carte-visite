<!DOCTYPE html>
<html>
    <head>
        <title>Carte de visite</title>
        <meta charset="UTF-8" >
        <style>
            body{
                font-family: sans-serif, Arial;
                margin: 40px;
                background-color: #f4f4f4;
            }
            .card {
                background: white;
                padding: 20px;
                border-radius: 5px;
                box-shadow: 0 2px 5px rgba(0,0,0,1);
            }
            h1{
                color: #333;
            }
        </style>
    </head>
    <body>  
    <div class="card">
        <h1>Prenom Nom</h1>
        <p>Developpeur Web</p>
        <p>Email: exemple@email.com</p>
    </div>
</body>
</html>
