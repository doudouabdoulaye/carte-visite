<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ma Carte de visite</title>
        <style>
            body{
                font-family: Arial,sans-serif;
                margin: 40px;
                background-color: #f4f4f4;
            }
            .card {

                background: white;
                padding: 20px;
                border-radius: 5px;
                box-shadow: 0 2px 5px rgba(0,0,0,1);
                border-top: 5px solid #3498db; 
            }
            h1
            {
                color: #3498db;
            }
            .contact 
            {
                margin-top: 20px;
                padding-top: 10px;
                border-top: 1px solid #eee;
            }
        </style>
    </head>
    <body>
        <div class="card" >
            <h1>Prenom Nom</h1>
            <p>Developpeur Web</p>
            <div class="contact" >
                <p>Email: exemple@email.com</p>
                <p>Github: github.com/username</p>
            </div>
        </div>
    </body>
</html>
